name: predictor-go-ci

on:
  pull_request:
    paths:
      - "advanced-programs/predictor-go/**"
      - ".github/workflows/predictor-go-ci.yml"
  push:
    branches:
      - master
      - main
    paths:
      - "advanced-programs/predictor-go/**"
      - ".github/workflows/predictor-go-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: advanced-programs/predictor-go/go.sum
      - name: Test predictor-go
        working-directory: advanced-programs/predictor-go
        run: go test ./...
