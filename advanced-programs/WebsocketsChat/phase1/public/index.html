<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Phase 1 WebSocket Chat</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="shell">
      <section class="toolbar">
        <div>
          <h1>WebSocket Chat</h1>
          <p>Phase 1: transport only, no LLM framework.</p>
        </div>
        <span id="status" class="status">connecting</span>
      </section>

      <section id="messages" class="messages" aria-live="polite"></section>

      <form id="chat-form" class="composer">
        <input id="username" name="username" value="learner" maxlength="32" autocomplete="username">
        <input id="content" name="content" placeholder="Type a message" autocomplete="off" autofocus>
        <button type="submit">Send</button>
      </form>
    </main>
    <script src="/main.js"></script>
  </body>
</html>
