[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vehicle-telemetry-ml"
version = "0.1.0"
description = "Python ML training layer for Go-orchestrated vehicle telemetry and perception demos."
requires-python = ">=3.10"
dependencies = [
    "dvc>=3.60",
    "joblib>=1.3",
    "jsonargparse[signatures]>=4.27",
    "lightning>=2.5",
    "mlflow>=3.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "pillow>=10",
    "pytest>=8.0",
    "scikit-learn>=1.4",
    "torch>=2.3",
    "torchmetrics>=1.4",
    "torchvision>=0.18",
    "wandb>=0.18",
]

[tool.setuptools.package-dir]
"" = "ml"

[tool.setuptools.packages.find]
where = ["ml"]

[tool.pytest.ini_options]
testpaths = ["ml/tests"]
pythonpath = ["ml"]
