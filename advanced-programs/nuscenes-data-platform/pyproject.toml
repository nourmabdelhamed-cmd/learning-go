[project]
name = "nuscenes-training-loader"
version = "0.1.0"
description = "Minimal PyTorch loader for the nuScenes Go data-platform manifest"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.0",
  "mlflow>=3.14.0",
  "numpy>=1.26",
  "pyarrow>=16.0",
  "torch>=2.2",
  "wandb>=0.27.2",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/training_loader"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
addopts = "-q"
